[pytest]
# 只收集 tests/ 下的用例。
#
# 这条不是洁癖, 是安全措施。scripts/ 下有一个 test_keeperhub_connection.py,
# 它不是一个 pytest 用例, 而是一个手动跑的连接自检脚本 —— 但它匹配 pytest
# 默认的 test_*.py 模式, 于是会在**收集阶段**被 import。该脚本顶层会把 .env
# 灌进 os.environ (这是它作为独立脚本的正确行为), 副作用是: 等 tests/ 里的
# 文件随后 import src.config 时, config 在模块级快照到的就是**真实 API Key**。
#
# 后果有两层:
#   1. conftest 的 monkeypatch.delenv 只清 os.environ, 改不到 config 里已经
#      快照的常量 -> 断言拿到真数据而失败 (只在全量跑时出现, 单跑文件却是
#      绿的, 极难定位)。
#   2. 更糟的是测试会在持有真 Key 的状态下运行, 存在误发真实请求的风险。
#
# 把收集范围钉死在 tests/, 从源头断掉这条链。
testpaths = tests

# 共享 venv 里装了 xonsh, 它自带的 pytest 插件在无终端环境 (CI / 后台执行)
# 会直接崩掉整个 session。默认关掉, 免得每次都要手敲。
addopts = -p no:xonsh
